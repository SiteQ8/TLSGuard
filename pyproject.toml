[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsguard"
version = "0.1.0"
description = "Audit and harden the TLS posture of your endpoints. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SiteQ8" }]
keywords = [
  "security",
  "tls",
  "ssl",
  "certificate",
  "network-security",
  "hardening",
  "devsecops",
  "cli",
  "monitoring",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/SiteQ8/TLSGuard"
Repository = "https://github.com/SiteQ8/TLSGuard"
Issues = "https://github.com/SiteQ8/TLSGuard/issues"

[project.scripts]
tlsguard = "tlsguard.cli:main"

[tool.setuptools.packages.find]
include = ["tlsguard*"]
